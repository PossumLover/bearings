<script>
(() => {
"use strict";

/* =====================================================================
   QUESTION BANK
   Every statement, decision question and exercise here is original.
   The personality items are the Mini-IPIP (Donnellan et al., 2006),
   which is in the public domain via the International Personality Item Pool.

   Item kinds:
     s  five-point statement. p = 1: agreeing is the healthy answer;
        p = -1: disagreeing is; p = 0: a values question with no right answer.
     c  a concrete decision with options. ord = options are ordered;
        g = partners may guess each other's pick; big = weighs more.
     w  "who should handle this", answered from each person's own side.
   ===================================================================== */
const S = (id, p, t, x) => Object.assign({ id, k: "s", p, t }, x);
const V = (id, t, x) => Object.assign({ id, k: "s", p: 0, t }, x);
const C = (id, t, o, x) => Object.assign({ id, k: "c", t, o }, x);
const W = (id, t, x) => Object.assign({ id, k: "w", t }, x);
const notMarried = s => s.stage !== "married";
const engaged = s => s.stage === "engaged";
const hasKids = s => s.kids && s.kids !== "none";

const TOPICS = [
{ id: "talk", title: "Communication", ex: "listen",
  intro: "How you share what you think and feel, and how well you feel heard.",
  items: [
    S("talk1", 1, "When something is bothering me, I bring it up within a day or two instead of letting it sit."),
    S("talk2", -1, "I often hold back what I really think so I don’t upset my partner."),
    S("talk3", 1, "When I’m talking, my partner puts the phone down and actually listens."),
    S("talk4", -1, "My partner sometimes uses a tone with me that feels belittling."),
    S("talk5", 1, "I can tell my partner I’m hurt without it turning into a fight."),
    S("talk6", -1, "There are subjects I’ve learned not to bring up with my partner."),
    S("talk7", 1, "My partner usually notices when something is off with me, even before I say anything."),
    S("talk8", -1, "I sometimes wonder whether my partner is telling me the whole story."),
    S("talk9", 1, "We regularly talk about more than logistics: ideas, worries, hopes."),
    S("talk10", -1, "When I ask my partner for something, they tend to hear it as criticism."),
    C("talk_c1", "How often do you want a real check-in about how the two of you are doing (not schedules or chores)?", ["Every day", "A few times a week", "Once a week", "Only when something comes up"], { ord: 1, g: 1 }),
    C("talk_c2", "When you’re upset, what do you need first?", ["To talk it through right away", "A little time, then talk", "Space until I come to you", "A distraction, then maybe talk"], { g: 1 }),
    C("talk_c3", "Is it OK to work through a disagreement over text?", ["Yes, text is fine", "Start by text, finish in person", "No, wait until we can talk"], { ord: 1, g: 1 }),
  ],
  prompt: "What is one thing you wish your partner understood about how you communicate?",
  ask: ["When do you feel most listened to by me? What was I doing?", "What topic is hardest for you to bring up with me, and why?", "How can I tell when you want me to listen rather than fix?"] },

{ id: "fight", title: "Conflict", ex: "fight",
  intro: "How you disagree, how arguments end, and how you make up.",
  items: [
    S("fight1", 1, "When we disagree, we usually land on something we can both live with."),
    S("fight2", -1, "Some of our arguments keep circling back to the same unsettled issue."),

  const clamp = v => Math.max(1, Math.min(5, v));
  const setup = { stage: "engaged", cohab: "yes", kids: "none", guess: true };
  const A = Object.assign(newPerson("Avery", "Theo", Object.assign({}, setup)), { done: true });
  const B = Object.assign(newPerson("Theo", "Avery", Object.assign({}, setup)), { done: true });
  const harmony = { talk: 0.5, fight: 0.3, style: 0.6, money: 0.6, time: 0.9, sex: 0.7, family: 0.4, roles: 0.8, meaning: 0.9, expect: 0.7, kids: 0.6, health: 0.8 };
  TOPICS.forEach(t => {
    if (t.when && !t.when(setup)) return;
    const h = harmony[t.id];
    t.items.forEach(it => {
      if (it.when && !it.when(setup)) return;
      if (it.k === "s") {
        const good = it.p >= 0 ? pick([4, 4, 5]) : pick([2, 2, 1]);
        const bad = it.p >= 0 ? pick([2, 1]) : pick([4, 5]);
        const roll = R();
        if (roll < h) { A.ans[it.id] = good; B.ans[it.id] = clamp(good + pick([0, 0, it.p >= 0 ? 1 : -1])); }
        else if (roll < h + (1 - h) * 0.5) { A.ans[it.id] = good; B.ans[it.id] = bad; if (R() < 0.5) [A.ans[it.id], B.ans[it.id]] = [B.ans[it.id], A.ans[it.id]]; }
        else if (roll < h + (1 - h) * 0.8) { A.ans[it.id] = 3; B.ans[it.id] = clamp(3 + pick([-1, 0, 1])); }
        else { A.ans[it.id] = bad; B.ans[it.id] = clamp(bad + pick([-1, 0, 1])); if (Math.abs(A.ans[it.id] - 3) < 1) B.ans[it.id] = bad; }
        if (!it.p) { const v = pick([2, 4, 4, 5]); A.ans[it.id] = v; B.ans[it.id] = R() < h ? clamp(v + pick([0, 1, -1])) : 6 - v; if (B.ans[it.id] === 3) B.ans[it.id] = 2; }
      } else if (it.k === "c") {
        const n = it.o.length;
        const a = Math.floor(R() * Math.min(n, it.unsure != null || it.na != null ? n - 1 : n));
        let b = R() < h ? a : (it.ord ? Math.max(0, Math.min(n - 1, a + pick([-1, 1]))) : Math.floor(R() * n));
        if (it.unsure != null && b === it.unsure) b = a;
        A.ans[it.id] = a; B.ans[it.id] = b;
        A.gs[it.id] = R() < 0.65 ? b : Math.floor(R() * n);
        B.gs[it.id] = R() < 0.55 ? a : Math.floor(R() * n);
      } else if (it.k === "w") {
        const a = pick([0, 1, 2, 2, 3, 4]); A.ans[it.id] = a;
        B.ans[it.id] = Math.max(0, Math.min(4, 4 - a + (R() < 0.6 ? 0 : pick([-1, 1]))));
      }
    });
  });
  // Planted results so the sample shows every kind of finding.
  const plant = { money_c1: [1, 3, 1, 1], kid_c1: [2, 2, 2, 2], kid_c2: [1, 3, 1, 1], sex_c1: [1, 0, 1, 1], fam_c3: [1, 3, 3, 1], exp_c1: [1, 1, 1, 1], mean_c1: [2, 3, 3, 2], fight_c3: [0, 2, 0, 0] };
  Object.entries(plant).forEach(([id, v]) => { A.ans[id] = v[0]; B.ans[id] = v[1]; A.gs[id] = v[2]; B.gs[id] = v[3]; });
  Object.assign(A.ans, { fight2: 4, fight10: 4, talk6: 4, money4: 2, role4: 4 });
  Object.assign(B.ans, { fight2: 4, fight10: 2, talk6: 2, money4: 4, role4: 2 });
  Object.assign(A.ans, { role_w1: 3, role_w2: 2, role_w3: 0, role_w4: 0, role_w5: 2, role_w6: 2, role_w7: 4, sex_w1: 2 });
  Object.assign(B.ans, { role_w1: 1, role_w2: 1, role_w3: 4, role_w4: 2, role_w5: 2, role_w6: 2, role_w7: 0, sex_w1: 1 });
  // About each of you.
  const standA = { cm: 5, cmp: 5, id: 2, sp: 4, sa: 4, av: 2, fc: 2 }, standB = { cm: 5, cmp: 4, id: 4, sp: 3, sa: 4, av: 4, fc: 1 };
  STAND.forEach(it => { const base = (p) => p[it.dim]; [[A, standA], [B, standB]].forEach(([P, s]) => { const v = clamp(base(s) + pick([0, 0, 1, -1])); P.ans[it.id] = it.r ? 6 - v : v; }); });
  const mapT = { a: { cc: 15, cf: 13, fc: 19, ff: 8 }, b: { cc: 18, cf: 15, fc: 10, ff: 17 } };
  [[A, mapT.a], [B, mapT.b]].forEach(([P, m]) => {
    ["cc", "cf", "fc", "ff"].forEach(dim => {
      const its = (dim[0] === "c" ? COUPLE_MAP : FAMILY).filter(it => it.dim === dim);
      let left = m[dim];
      its.forEach((it, i) => { const remaining = its.length - i; const v = i === its.length - 1 ? clamp(left) : clamp(Math.round(left / remaining + pick([-1, 0, 1]))); left -= v; P.ans[it.id] = it.r ? 6 - v : v; });
    });
  });
  Object.assign(A.ans, { grow_c1: 0, grow_c2: 1, grow_c3: 0 });
  Object.assign(B.ans, { grow_c1: 1, grow_c2: 2, grow_c3: 0 });
  const persA = { E: 2, A: 4, C: 5, N: 3, I: 4 }, persB = { E: 5, A: 4, C: 2, N: 2, I: 3 };
  IPIP.forEach((x, i) => {
    const set = (P, id, base) => { const v = clamp(base + pick([0, 0, 1, -1])); P.ans[id] = x[1] ? 6 - v : v; };
    set(A, "me" + (i + 1), persA[x[0]]); set(B, "me" + (i + 1), persB[x[0]]);
    set(A, "you" + (i + 1), persB[x[0]] + (x[0] === "N" ? 1 : 0)); set(B, "you" + (i + 1), persA[x[0]] + (x[0] === "E" ? 1 : 0));
  });
  STRESS.forEach(it => { A.ans[it.id] = pick([1, 2, 2, 3]); B.ans[it.id] = pick([1, 2, 3, 3]); });
  Object.assign(A.ans, { str_work: 4, str_wedding: 5, str_sleep: 4 });
  Object.assign(B.ans, { str_money: 4, str_wedding: 4, str_job: 5 });
  A.open = { talk: "I go quiet when I’m upset, but I do want to talk. I just need an hour first.", money: "Money was always tight, so I like having a cushion. Spending it makes me anxious.", expect: "Coffee on the porch, kids at school, both of us working but home by six.", growing: "Keep: big family dinners. Leave behind: never talking about anything uncomfortable." };
  B.open = { talk: "When I push to talk right away it’s because silence makes me nervous, not because I want a fight.", money: "We never talked about money at all. I learned everything the hard way.", expect: "Living somewhere with mountains, working remotely, a dog, maybe one kid.", growing: "Keep: how my mom made every birthday a big deal. Leave behind: the yelling." };
  return { A, B };
}

const app = document.getElementById("app");
const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 4.5 L19.2 16 L16 27.5 L12.8 16 Z" fill="var(--pa)"/><path d="M16 4.5 L19.2 16 L12.8 16 Z" fill="var(--pb)"/><circle cx="16" cy="16" r="1.8" fill="var(--paper)"/></svg>`;

function render() {
  const s = ui.screen;
  let main = "";
  if (s === "home") main = renderHome();
  else if (s === "section") main = renderSection();
  else if (s === "share") main = renderShare();
  else if (s === "import") main = renderImport();
  else if (s === "handoff") main = renderHandoff();
  else if (s === "safety") main = renderSafety();
  else if (s === "results") main = renderResults();
  else if (s === "about") main = renderAbout();

function renderBar() {
  const p = me();
  const canResults = !!resultsPair() || ui.sample;
  const nav = [];
  if (p) nav.push(`<button class="navbtn" data-act="go" data-to="home" ${["home", "section", "share", "import", "handoff", "safety"].includes(ui.screen) && !ui.sample ? 'aria-current="page"' : ""}>Questions</button>`);
  if (canResults) nav.push(`<button class="navbtn" data-act="go" data-to="results" ${ui.screen === "results" ? 'aria-current="page"' : ""}>Results</button>`);
  nav.push(`<button class="navbtn" data-act="go" data-to="about" ${ui.screen === "about" ? 'aria-current="page"' : ""}>How it works</button>`);
  return `<header class="bar"><div class="bar-in"><button class="brand" data-act="go" data-to="home">${LOGO}Bearings</button><nav class="bar-nav" aria-label="Main">${nav.join("")}</nav></div></header>`;
}

function resultsPair() {
  const a = data.people.a, b = data.people.b;
  if (!a || !b || !a.done || !b.done) return null;
  return data.active === "a" ? [a, b] : [b, a];
}

        ${pair ? `<button class="btn primary" data-act="go" data-to="results">See your results</button>` : ""}

      </div>
      ${ui.finishWarn ? `<div class="notice warn stack"><p>You have ${left} unanswered question${left === 1 ? "" : "s"}. Unanswered questions are simply left out of the comparison.</p><div class="row-wrap"><button class="btn primary" data-act="finish" data-force="1">Finish anyway</button><button class="btn ghost" data-act="finishCancel">Keep answering</button></div></div>` : ""}

/* ---------- Questionnaire ---------- */
function itemHTML(it, p) {
  const v = p.ans[it.id];
  const pressed = i => `aria-pressed="${v === i}"`;
  let body = "";
  if (it.k === "s") {
    const labels = SCALES[it.sc || "agree"];
    body = `<div class="scale" data-grp role="group" aria-label="${esc(fill(it.t, p))}">${labels.map((l, i) => `<button type="button" class="opt" data-act="ans" data-id="${it.id}" data-v="${i + 1}" ${pressed(i + 1)}><b>${i + 1}</b><span>${l}</span></button>`).join("")}</div>`;
  } else if (it.k === "c") {
    body = `<div class="choices" data-grp role="group">${it.o.map((o, i) => `<button type="button" class="choice" data-act="ans" data-id="${it.id}" data-v="${i}" ${pressed(i)}>${esc(o)}</button>`).join("")}</div>`;
    if (it.g && p.setup.guess) {
      const g = p.gs[it.id];
      body += `<div class="guess" ${v == null ? "hidden" : ""}><p class="small"><b>Your guess:</b> what will ${esc(p.partner)} pick?</p><div class="choices" data-grp>${it.o.map((o, i) => `<button type="button" class="choice" data-act="guess" data-id="${it.id}" data-v="${i}" aria-pressed="${g === i}">${esc(o)}</button>`).join("")}</div></div>`;
    }
  } else if (it.k === "w") {
    const opts = ["Me", "Mostly me", "Both equally", "Mostly " + p.partner, p.partner];
    body = `<div class="whogrid" data-grp role="group">${opts.map((o, i) => `<button type="button" class="choice" style="text-align:center" data-act="ans" data-id="${it.id}" data-v="${i}" ${pressed(i)}>${esc(o)}</button>`).join("")}</div>`;
  }
  return `<div class="q" id="q-${it.id}"><p class="qt">${esc(fill(it.t, p))}</p>${body}</div>`;
}

function renderSection() {
  const p = me();

      <h1 style="font-size:clamp(2rem,6vw,2.8rem)">Over to ${esc(p.partner)}</h1>
      <p class="lede">${esc(p.name)}, your answers are saved and hidden. Hand the device to ${esc(p.partner)}.</p>
      <div class="row-wrap" style="justify-content:center"><button class="btn primary" data-act="switch">I’m ${esc(p.partner)}, ${o ? "continue" : "start"}</button><button class="btn ghost" data-act="go" data-to="home">Not yet</button></div>
    </div></main>`;
}

function renderShare() {
  const p = me();
  return `<main class="wrap stack-lg">
    <div class="sechead"><p class="eyebrow">Share</p><h2>Your answer code</h2>
    <p class="muted">Send this code to ${esc(p.partner)} by text or email. They paste it into “Add ${esc(p.name)}’s answers” on their device. Ask them to send you theirs too, so you can both see the results.</p></div>
    ${ui.code ? `<textarea class="code" id="code" readonly>${esc(ui.code)}</textarea>
      <div class="row-wrap"><button class="btn primary" data-act="copy">Copy code</button><span id="copied" class="small muted" role="status"></span></div>` : `<p>Preparing your code…</p>`}
    <div class="notice small">Anyone with this code can read your answers, so send it only to ${esc(p.partner)}. Your private check isn’t included. You can also keep the code as a backup.</div>
    <div class="row-wrap"><button class="btn" data-act="go" data-to="import">Add ${esc(p.partner)}’s answers</button><button class="btn ghost" data-act="go" data-to="home">Back</button></div>
  </main>`;
}

function renderImport() {
  const p = me();
  return `<main class="wrap stack-lg">
    <div class="sechead"><p class="eyebrow">Combine</p><h2>Add ${esc(p.partner)}’s answers</h2>
    <p class="muted">Paste the answer code ${esc(p.partner)} sent you. It’s unpacked here on your device; nothing is uploaded.</p></div>
    <label class="field"><span>Answer code</span><textarea class="code" id="importcode" placeholder="BRG1.…"></textarea></label>
    ${ui.importMsg ? `<div class="notice ${ui.importMsg.ok ? "good" : "bad"}" role="status">${esc(ui.importMsg.text)}</div>` : ""}
    <div class="row-wrap"><button class="btn primary" data-act="import">Add answers</button><button class="btn ghost" data-act="go" data-to="home">Back</button></div>
    ${!p.done ? `<p class="small muted">You can add the code now, but the results unlock once you’ve finished your own answers, so theirs can’t influence yours.</p>` : ""}
  </main>`;
}

/* ---------- Results ---------- */
function pairForResults() {
  if (ui.sample) return [ui.sample.A, ui.sample.B];
  return resultsPair();
}
function talkState() { return ui.sample ? ui.sampleTalk : data.talk; }

function renderResults() {
  const pair = pairForResults();
  if (!pair) return `<main class="wrap"><p>Results appear once you’ve both finished.</p></main>`;
  const [A, B] = pair;
  const R = analyze(A, B);
  const tabs = [["overview", "Overview"], ["topics", "Topics"], ["decisions", "Decisions"], ["us", "The two of you"], ["talk", "Talk list"], ["exercises", "Exercises"]];
  let body = "";
  if (ui.tab === "overview") body = resOverview(R);
  else if (ui.tab === "topics") body = resTopics(R);
  else if (ui.tab === "decisions") body = resDecisions(R);
  else if (ui.tab === "us") body = resUs(R);
  else if (ui.tab === "talk") body = resTalk(R);
  else body = resExercises(R);
  return `<main class="wrap wide">
    ${ui.sample ? `<div class="samplebar"><span><b>Sample report.</b> Avery and Theo are a fictional couple; every answer is invented.</span><button class="btn" data-act="exitSample">${me() ? "Back to my answers" : "Set up our own"}</button></div>` : ""}
    <div class="stack" style="margin-bottom:14px"><p class="eyebrow">Results</p><h1 style="font-size:clamp(2rem,6vw,2.8rem)"><span style="color:var(--pa)">${esc(A.name)}</span> &amp; <span style="color:var(--pb)">${esc(B.name)}</span></h1></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ui.tab === k}" data-act="tab" data-tab="${k}">${l}</button>`).join("")}</div>
    ${body}
  </main>`;
}

const nameA = R => `<span class="who"><span class="dot a"></span>${esc(R.A.name)}</span>`;
const nameB = R => `<span class="who"><span class="dot b"></span>${esc(R.B.name)}</span>`;

function resOverview(R) {
  const groups = { strong: [], good: [], mid: [], low: [] };
  R.topics.filter(x => x.pca != null).forEach(x => groups[band(x.pca).k].push(x));
  const bandBox = (k, label, sub) => `<div class="band ${k}"><h4>${label}</h4><p class="small muted">${sub}</p><ul>${groups[k].length ? groups[k].map(x => `<li>${esc(x.t.title)}</li>`).join("") : `<li class="muted">None</li>`}</ul></div>`;
  const idealNote = (P, s) => s == null ? "" : `<li>${esc(P.name)}: <b>${s >= 65 ? "rose-colored" : s >= 40 ? "a little rosy" : "realistic"}</b> (${s}%)${s >= 65 ? ". Expect this person’s answers to look sunnier than things really are." : "."}</li>`;
  const top = R.talk.slice(0, 6);
  return `<div class="stack-lg">
    <div class="grid2">
      <section class="stack">
        <p class="eyebrow">Agreement across topics</p>
        <p style="font-family:var(--f-display);font-size:3.4rem;line-height:1;font-weight:800">${R.overall == null ? "–" : R.overall + "%"}</p>
        <p class="muted">Share of statements where you both answered on the same side and in the healthy direction. There’s no passing score. Nobody agrees on everything, and the useful part is the list of specific differences.</p>
        <p class="small muted">Guessing: ${esc(R.A.name)} got ${R.guesses.a[0]} of ${R.guesses.a[1]} right, ${esc(R.B.name)} got ${R.guesses.b[0]} of ${R.guesses.b[1]}.</p>
      </section>
      <section class="stack">
        <p class="eyebrow">Rose-colored glasses check</p>
        <ul class="stack small" style="margin:0;padding-left:1.1em">${idealNote(R.A, R.ideal.a)}${idealNote(R.B, R.ideal.b)}</ul>
        <p class="small muted">Based on seven deliberately extreme statements like “My partner has never disappointed me.” Agreeing with many of them usually means seeing the relationship through a filter.</p>
      </section>
    </div>
    <div class="bands">
      ${bandBox("strong", "Strengths", "80% agreement or more")}
      ${bandBox("good", "Likely strengths", "50 to 79%")}
      ${bandBox("mid", "Worth discussing", "30 to 49%")}
      ${bandBox("low", "Talk about first", "Under 30%")}
    </div>
    <section class="stack">
      <h3>By topic</h3>
      <div class="legend"><span>Bar: how much you agree</span><span>Numbers: how positive each of you feels about the topic, 0–100</span></div>
      <div class="tbars">${R.topics.filter(x => x.pca != null).map(x => { const b = band(x.pca); return `<button class="tbar" data-act="topic" data-topic="${x.t.id}"><span class="nm">${esc(x.t.title)}</span><span class="track"><i class="fill-${b.k}" style="width:${Math.max(3, x.pca)}%"></i></span><span class="pct">${x.pca}%</span><span class="ind"><span class="who"><span class="dot a"></span>${x.indA ?? "–"}</span><span class="who"><span class="dot b"></span>${x.indB ?? "–"}</span><span>${b.label}</span></span></button>`; }).join("")}</div>
    </section>
    <section class="stack">
      <div class="row-wrap" style="justify-content:space-between"><h3>Start here</h3><button class="linkbtn" data-act="tab" data-tab="talk">Full talk list (${R.talk.length})</button></div>
      <div>${top.map(r => talkRow(R, r)).join("")}</div>
    </section>
  </div>`;
}

function pips(R, a, b) {
  return `<div class="pips">${[1, 2, 3, 4, 5].map(v => `<div class="pip">${a === v ? `<span class="a" title="${esc(R.A.name)}">${esc(R.A.name[0])}</span>` : ""}${b === v ? `<span class="b" title="${esc(R.B.name)}">${esc(R.B.name[0])}</span>` : ""}</div>`).join("")}</div>`;
}
const pipKey = () => `<div class="pipkey">${SCALES.agree.map(l => `<span>${l}</span>`).join("")}</div>`;
function whoLabel(i, P, Q) { return [P.name, "Mostly " + P.name, "Both equally", "Mostly " + Q.name, Q.name][i]; }
function choiceAnswers(R, r) {
  const it = r.it;
  if (it.k === "w") return `<div class="ans"><div>${nameA(R)}<span>${esc(whoLabel(r.a, R.A, R.B))}</span></div><div>${nameB(R)}<span>${esc(whoLabel(r.b, R.B, R.A))}</span></div></div>`;
  const gl = (who, g, actual) => g == null ? "" : g === actual ? `<span class="ok">✓</span> ${esc(who)} guessed right` : `<span class="no">✗</span> ${esc(who)} guessed “${esc(it.o[g])}”`;
  const gA = gl(R.A.name, r.ga, r.b), gB = gl(R.B.name, r.gb, r.a);
  return `<div class="ans"><div>${nameA(R)}<span>${esc(it.o[r.a])}</span></div><div>${nameB(R)}<span>${esc(it.o[r.b])}</span></div></div>${gA || gB ? `<p class="gs">${[gA, gB].filter(Boolean).join(" · ")}</p>` : ""}`;
}
function starBtns(id) {
  const ts = talkState();
  return `<button class="iconbtn" data-act="star" data-id="${id}" aria-pressed="${!!ts.star[id]}" title="Add to talk list">★</button><button class="iconbtn donebtn" data-act="done" data-id="${id}" aria-pressed="${!!ts.done[id]}" title="Mark as talked about">✓</button>`;
}
function itemRow(R, r, opts) {
  const it = r.it;
  const tag = it.k === "s" && !it.p ? `<span class="chip tag">values</span>` : "";
  const detail = it.k === "s" ? pips(R, r.a, r.b) : choiceAnswers(R, r);
  return `<div class="item"><div class="stack" style="gap:8px">${opts && opts.topic ? `<span class="eyebrow">${esc(r.topic.title)}</span>` : ""}<p>${esc(it.k === "w" ? "Who should handle: " + it.t : it.t.replace(/\{p\}/g, "partner"))} ${tag}</p>${detail}</div><div class="side"><span class="chip ${r.cat}">${CAT_LABEL[r.cat]}</span>${r.miss ? `<span class="chip tag">surprise</span>` : ""}${starBtns(it.id)}</div></div>`;
}
const talkRow = (R, r) => itemRow(R, r, { topic: true });

function resTopics(R) {
  const x = R.topics.find(t => t.t.id === ui.topic);
  if (!x) {
    return `<div class="stack"><p class="muted">Pick a topic to see every answer side by side, what to talk about, and an exercise to try.</p><div class="tbars">${R.topics.map(x => { const b = x.pca == null ? null : band(x.pca); return `<button class="tbar" data-act="topic" data-topic="${x.t.id}"><span class="nm">${esc(x.t.title)}</span><span class="track">${b ? `<i class="fill-${b.k}" style="width:${Math.max(3, x.pca)}%"></i>` : ""}</span><span class="pct">${x.pca == null ? "" : x.pca + "%"}</span><span class="ind">${b ? b.label : ""}</span></button>`; }).join("")}</div></div>`;
  }
  return topicDetail(R, x);
}

function topicDetail(R, x) {
  const t = x.t, b = band(x.pca ?? 0);
  const st = x.rows.filter(r => r.it.k === "s");
  const ch = x.rows.filter(r => r.it.k !== "s");
  const by = k => st.filter(r => r.cat === k);
  const strengths = by("agree").filter(r => r.it.p).slice(0, 2);
  const discuss = by("concern").concat(by("differ"), by("unsure")).slice(0, 3);
  const group = (k, title, note) => { const rs = by(k); return rs.length ? `<section class="stack"><h4>${title} <span class="muted small">(${rs.length})</span></h4>${note ? `<p class="small muted">${note}</p>` : ""}<div>${pipKey()}${rs.map(r => itemRow(R, r)).join("")}</div></section>` : ""; };
  const ex = EX[t.ex];
  const oa = R.A.open[t.id], ob = R.B.open[t.id];
  const i = TOPICS.findIndex(q => q.id === t.id);
  const nav = R.topics;
  const j = nav.findIndex(q => q.t.id === t.id);
  return `<div class="stack-lg">
    <div class="row-wrap" style="justify-content:space-between"><button class="linkbtn" data-act="topic" data-topic="">← All topics</button>
      <div class="row-wrap">${nav[j - 1] ? `<button class="btn ghost" data-act="topic" data-topic="${nav[j - 1].t.id}">← ${esc(nav[j - 1].t.title)}</button>` : ""}${nav[j + 1] ? `<button class="btn ghost" data-act="topic" data-topic="${nav[j + 1].t.id}">${esc(nav[j + 1].t.title)} →</button>` : ""}</div></div>
    <div class="detailhead"><p class="eyebrow">Topic ${i + 1}</p><h2>${esc(t.title)}</h2><p class="muted">${esc(t.intro)}</p>
      <div class="row-wrap"><span class="chip ${b.k === "strong" || b.k === "good" ? "agree" : b.k === "mid" ? "unsure" : "concern"}">${b.label} · ${x.pca}% agreement</span><span class="small muted">How positive each of you feels:</span>${nameA(R)}<span class="mono">${x.indA ?? "–"}</span>${nameB(R)}<span class="mono">${x.indB ?? "–"}</span></div>
    </div>
    <section class="card stack">
      <h3>Tonight’s conversation</h3>
      <p class="small muted">Start with what’s working, then take two or three items to discuss. Use the listening exercise if it gets heated.</p>
      ${strengths.length ? `<p class="eyebrow">Start with</p><ul class="asklist">${strengths.map(r => `<li>${esc(r.it.t)}</li>`).join("")}</ul>` : ""}
      ${discuss.length ? `<p class="eyebrow">Then talk about</p><ul class="asklist">${discuss.map(r => `<li>${esc(r.it.t)} <span class="chip ${r.cat}">${CAT_LABEL[r.cat]}</span></li>`).join("")}</ul>` : `<p>No disagreements on the statements here. Use the questions below to go deeper.</p>`}
      <p class="eyebrow">Questions to ask each other</p><ul class="asklist">${t.ask.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    </section>
    ${oa || ob ? `<section class="stack"><h3>In your own words</h3><p class="muted">${esc(t.prompt)}</p><div class="openans">${oa ? `<blockquote><b>${esc(R.A.name)}:</b> ${esc(oa)}</blockquote>` : ""}${ob ? `<blockquote class="b"><b>${esc(R.B.name)}:</b> ${esc(ob)}</blockquote>` : ""}</div></section>` : ""}
    ${ch.length ? `<section class="stack"><h3>Decisions</h3><div>${ch.map(r => itemRow(R, r)).join("")}</div></section>` : ""}
    <div class="stack-lg">
      ${group("concern", "Shared concerns", "You both answered on the worried side. These are often the most useful to talk about.")}
      ${group("differ", "You see these differently", "Two or more points apart.")}
      ${group("unsure", "One of you isn’t sure", "Unsure answers often mean the topic hasn’t been discussed yet.")}
      ${group("agree", "You agree", "")}
    </div>
    ${ex ? exCard(ex) : ""}
  </div>`;
}

function exCard(ex) { return `<section class="card ex"><p class="eyebrow">Try this · about ${ex.min} minutes</p><h3>${esc(ex.t)}</h3><p class="muted small">${esc(ex.why)}</p><ol>${ex.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>`; }

function resDecisions(R) {
  const all = [];
  R.topics.forEach(x => x.rows.forEach(r => { if (r.it.k !== "s") all.push(Object.assign({ topic: x.t }, r)); }));
  const counts = { same: 0, close: 0, far: 0, differ: 0, unsure: 0 };
  all.forEach(r => counts[r.cat]++);
  const who = all.filter(r => r.it.k === "w");
  const choices = all.filter(r => r.it.k === "c");
  return `<div class="stack-lg">
    <p class="muted">Concrete choices, compared directly. “Close” means one step apart on an ordered scale. Where you guessed each other’s answers, a cross marks a surprise.</p>
    <div class="row-wrap"><span class="chip same">Same ${counts.same}</span><span class="chip close">Close ${counts.close}</span><span class="chip far">Far apart ${counts.far + counts.differ}</span><span class="chip unsure">Unsure ${counts.unsure}</span></div>
    <section class="stack"><h3>Who does what</h3><p class="small muted">Each of you answered from your own side. Matching answers mean you picture the same person doing the job.</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Job</th><th>${esc(R.A.name)} says</th><th>${esc(R.B.name)} says</th><th></th></tr></thead><tbody>${who.map(r => `<tr><td>${esc(r.it.t)}</td><td>${esc(whoLabel(r.a, R.A, R.B))}</td><td>${esc(whoLabel(r.b, R.B, R.A))}</td><td><span class="chip ${r.cat}">${CAT_LABEL[r.cat]}</span></td></tr>`).join("")}</tbody></table></div></section>
    <section class="stack"><h3>Everything else</h3><div>${choices.map(r => itemRow(R, r, { topic: true })).join("")}</div></section>
  </div>`;
}

function mapSVG(R, dims, title) {
  const W = 400, H = 400, pad = 60, cell = (W - pad - 20) / 5;
  const pts = [[R.A, "a"], [R.B, "b"]].map(([P, k]) => { const x = mapSum(P, dims[0]), y = mapSum(P, dims[1]); return x == null || y == null ? null : { k, x, y, px: pad + mapPos(x) * cell, py: 20 + (5 - mapPos(y)) * cell }; });
  if (pts[0] && pts[1] && Math.abs(pts[0].px - pts[1].px) < 14 && Math.abs(pts[0].py - pts[1].py) < 14) { pts[0].px -= 8; pts[1].px += 8; }
  let g = "";
  for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
    const bal = i >= 1 && i <= 3 && j >= 1 && j <= 3;
    g += `<rect x="${pad + i * cell}" y="${20 + j * cell}" width="${cell}" height="${cell}" style="fill:${bal ? "var(--agree-bg)" : "var(--wash)"};stroke:var(--paper);stroke-width:2"/>`;
  }
  const xl = CLOSE_L.map((l, i) => `<text x="${pad + i * cell + cell / 2}" y="${20 + 5 * cell + 16}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${l}</text>`).join("");
  const yl = FLEX_L.map((l, i) => `<text x="${pad - 6}" y="${20 + (4 - i) * cell + cell / 2 + 3}" text-anchor="end" style="fill:var(--muted);font-size:10px">${l}</text>`).join("");
  const dots = pts.filter(Boolean).map(p => `<circle cx="${p.px}" cy="${p.py}" r="11" style="fill:var(--p${p.k});stroke:var(--card);stroke-width:2"/><text x="${p.px}" y="${p.py + 4}" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:700">${esc((p.k === "a" ? R.A : R.B).name[0])}</text>`).join("");
  return `<div class="mapwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}<text x="${pad + 2.5 * cell}" y="${H - 6}" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">Closeness →</text><text x="12" y="${20 + 2.5 * cell}" text-anchor="middle" transform="rotate(-90 12 ${20 + 2.5 * cell})" style="fill:var(--ink);font-size:11px;font-weight:700">Flexibility →</text>${xl}${yl}${dots}</svg></div>`;
}
function mapText(R, dims, family) {
  return [[R.A, "a"], [R.B, "b"]].map(([P, k]) => {
    const x = mapSum(P, dims[0]), y = mapSum(P, dims[1]);
    if (x == null || y == null) return "";
    const cl = mapLevel(x) - 1, fl = mapLevel(y) - 1;
    const subj = family ? `${esc(P.name)} grew up in a family that was` : `${esc(P.name)} sees the relationship as`;
    return `<p><span class="who"><span class="dot ${k}"></span></span> ${subj} <b>${CLOSE_L[cl].toLowerCase()}</b> (${CLOSE_D[cl]}) and <b>${FLEX_L[fl].toLowerCase()}</b> (${FLEX_D[fl]})</p>`;
  }).join("");
}

function resUs(R) {
  const A = R.A, B = R.B;
  const traitRow = t => {
    const sa = traitScore(A, "me", t.k, t.flip), oa = traitScore(B, "you", t.k, t.flip);
    const sb = traitScore(B, "me", t.k, t.flip), ob = traitScore(A, "you", t.k, t.flip);
    const mk = (cls, v, title) => v == null ? "" : `<span class="mk ${cls}" style="left:${v}%" title="${esc(title)}: ${v}"></span>`;
    const notes = [];
    if (sa != null && sb != null && Math.abs(sa - sb) >= 30) notes.push(`You differ here: ${esc(sa > sb ? A.name : B.name)} is more ${t.name.toLowerCase()}.`);
    if (sa != null && oa != null && Math.abs(sa - oa) >= 25) notes.push(`${esc(B.name)} sees ${esc(A.name)} as ${oa > sa ? "more" : "less"} ${t.name.toLowerCase()} than ${esc(A.name)} does.`);
    if (sb != null && ob != null && Math.abs(sb - ob) >= 25) notes.push(`${esc(A.name)} sees ${esc(B.name)} as ${ob > sb ? "more" : "less"} ${t.name.toLowerCase()} than ${esc(B.name)} does.`);
    return `<div class="trait"><div class="row-wrap" style="justify-content:space-between"><b>${t.name}</b></div>
      <div class="ttrack">${mk("fa", sa, A.name + " (self)")}${mk("ha", oa, A.name + " as seen by " + B.name)}</div>
      <div class="ttrack">${mk("fb", sb, B.name + " (self)")}${mk("hb", ob, B.name + " as seen by " + A.name)}</div>
      <div class="tends"><span>${t.lo}</span><span>${t.hi}</span></div>
      ${notes.length ? `<p class="small">${notes.join(" ")}</p>` : ""}</div>`;
  };
  const dynTable = DYN.map(d => {
    const la = level3(scoreDim(A, STAND, d.k)), lb = level3(scoreDim(B, STAND, d.k));
    return `<tr><td><b>${d.name}</b></td><td><span class="lv">${la}</span><br><span class="small muted">${esc(A.name)} ${d.d[la] || ""}</span></td><td><span class="lv">${lb}</span><br><span class="small muted">${esc(B.name)} ${d.d[lb] || ""}</span></td></tr>`;
  }).join("");
  const controlled = [A, B].filter(P => level3(scoreDim(P, STAND, "fc")) === "High");
  const commitItems = STAND.filter(it => it.dim === "cm" || it.dim === "cmp");
  const stressTop = P => STRESS.filter(it => (P.ans[it.id] || 0) >= 4).sort((x, y) => P.ans[y.id] - P.ans[x.id]);
  const stressLvl = P => { const vals = STRESS.filter(it => P.ans[it.id] != null).map(it => P.ans[it.id]); const s = pct(vals); return s == null ? "–" : s < 30 ? "Low" : s < 50 ? "Moderate" : "High"; };
  const tA = stressTop(A), tB = stressTop(B);
  const shared = tA.filter(it => tB.includes(it));
  const facts = FAMILY.filter(it => it.k === "c");
  return `<div class="stack-lg">
    <div class="grid2">
      <section class="stack"><h3>Your relationship map</h3><p class="small muted">How close and how flexible each of you says the relationship is. The green middle is the balanced zone; most healthy couples sit somewhere inside it.</p>${mapSVG(R, ["cc", "cf"], "Relationship map")}<div class="stack small">${mapText(R, ["cc", "cf"], false)}</div></section>
      <section class="stack"><h3>The families you grew up in</h3><p class="small muted">The same map for each family of origin. Big gaps between your families can show up as different instincts about holidays, privacy and rules.</p>${mapSVG(R, ["fc", "ff"], "Family maps")}<div class="stack small">${mapText(R, ["fc", "ff"], true)}</div></section>
    </div>
    <section class="stack"><h3>Personality</h3>
      <div class="legend"><span><span class="mk fa"></span>${esc(A.name)}, self</span><span><span class="mk ha"></span>${esc(A.name)}, as ${esc(B.name)} sees them</span><span><span class="mk fb"></span>${esc(B.name)}, self</span><span><span class="mk hb"></span>${esc(B.name)}, as ${esc(A.name)} sees them</span></div>
      <div>${TRAITS.map(traitRow).join("")}</div>
      <p class="small muted">From the 20-item Mini-IPIP, a short public-domain measure of the Big Five. No end of any scale is better; differences are something to understand, not fix.</p>
    </section>
    <div class="grid2">
      <section class="stack"><h3>How each of you shows up</h3><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>${esc(A.name)}</th><th>${esc(B.name)}</th></tr></thead><tbody>${dynTable}</tbody></table></div>
        ${controlled.length ? `<div class="notice warn small">${controlled.map(P => esc(P.name)).join(" and ")} often feel${controlled.length === 1 ? "s" : ""} controlled. That’s worth a careful conversation. If it ever feels unsafe to have it, the private check on the Questions page lists confidential help.</div>` : ""}
      </section>
      <section class="stack"><h3>Commitment</h3><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>${esc(A.name)}</th><th>${esc(B.name)}</th></tr></thead><tbody>${commitItems.map(it => `<tr><td>${esc(it.t)}</td><td>${SCALES.agree[(A.ans[it.id] || 3) - 1]}</td><td>${SCALES.agree[(B.ans[it.id] || 3) - 1]}</td></tr>`).join("")}</tbody></table></div></section>
    </div>
    <div class="grid2">
      <section class="stack"><h3>Stress lately</h3>
        <div class="kv"><span>${nameA(R)}</span><span>${stressLvl(A)} overall</span><span>${nameB(R)}</span><span>${stressLvl(B)} overall</span></div>
        <p class="small"><b>${esc(A.name)}’s top stressors:</b> ${tA.length ? tA.map(it => esc(it.t)).join(", ") : "none rated often"}</p>
        <p class="small"><b>${esc(B.name)}’s top stressors:</b> ${tB.length ? tB.map(it => esc(it.t)).join(", ") : "none rated often"}</p>
        ${shared.length ? `<p class="small"><b>Shared:</b> ${shared.map(it => esc(it.t)).join(", ")}. Stress you share is easier to tackle as a team.</p>` : ""}
      </section>
      <section class="stack"><h3>Growing up</h3><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>${esc(A.name)}</th><th>${esc(B.name)}</th></tr></thead><tbody>${facts.map(it => `<tr><td>${esc(it.t)}</td><td>${A.ans[it.id] != null ? esc(it.o[A.ans[it.id]]) : "–"}</td><td>${B.ans[it.id] != null ? esc(it.o[B.ans[it.id]]) : "–"}</td></tr>`).join("")}</tbody></table></div>
        ${A.open.growing || B.open.growing ? `<div class="openans">${A.open.growing ? `<blockquote><b>${esc(A.name)}:</b> ${esc(A.open.growing)}</blockquote>` : ""}${B.open.growing ? `<blockquote class="b"><b>${esc(B.name)}:</b> ${esc(B.open.growing)}</blockquote>` : ""}</div>` : ""}
      </section>
    </div>
  </div>`;
}

function resTalk(R) {
  const ts = talkState();
  const f = ui.talkFilter;
  let rows = R.talk;
  if (f === "star") rows = rows.filter(r => ts.star[r.it.id]);
  if (f === "open") rows = rows.filter(r => !ts.done[r.it.id]);
  const doneCount = R.talk.filter(r => ts.done[r.it.id]).length;
  return `<div class="stack">
    <p class="muted">Everything worth a conversation, most important first: big decisions where you’re far apart, shared concerns, then clear differences. Star the ones you want to cover and tick them off as you go. ${R.talk.length ? `You’ve talked about ${doneCount} of ${R.talk.length}.` : ""}</p>
    <div class="filters" role="group" aria-label="Filter">${[["all", "All"], ["open", "Not talked about yet"], ["star", "Starred"]].map(([k, l]) => `<button data-act="talkFilter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div>
    <div>${rows.length ? rows.map(r => talkRow(R, r)).join("") : `<p class="muted">Nothing here.</p>`}</div>
  </div>`;
}

function resExercises(R) {
  const low = R.topics.filter(x => x.pca != null).sort((a, b) => a.pca - b.pca).slice(0, 3).map(x => x.t.ex);
  const sug = Array.from(new Set(["checkin", "listen", "fight", "timeout"].concat(low)));
  const rest = Object.keys(EX).filter(k => !sug.includes(k));
  return `<div class="stack-lg">
    <p class="muted">Short structured conversations. The first few are suggested for you: the core skills, plus your three lowest-agreement topics.</p>
    <section class="stack"><h3>Suggested for you</h3><div class="grid2">${sug.map(k => exCard(EX[k])).join("")}</div></section>
    <section class="stack"><h3>More</h3><div class="grid2">${rest.map(k => exCard(EX[k])).join("")}</div></section>
  </div>`;
}

/* ---------- About ---------- */
function renderAbout() {
  return `<main class="wrap stack-lg">
    <div class="sechead"><p class="eyebrow">How it works</p><h2>What Bearings does, and doesn’t</h2></div>
    <section class="stack"><h3>The idea</h3><p>Premarital inventories used by counselors and clergy work the same basic way: each partner answers a long questionnaire alone, and the results show, item by item, where you agree and where you don’t. The value is in the conversations that follow, not in any score. Bearings follows that structure, with original questions, and adds concrete decisions, guessing, and two-way personality ratings.</p></section>
    <section class="stack"><h3>How answers are compared</h3>
      <div class="tblwrap"><table class="tbl"><tbody>
        <tr><td><span class="chip agree">Agree</span></td><td>You’re both on the same side of “not sure”, and it’s the healthy side. For values questions, which have no healthy side, any shared answer counts.</td></tr>
        <tr><td><span class="chip differ">Differ</span></td><td>Your answers are two or more points apart.</td></tr>
        <tr><td><span class="chip unsure">Unsure</span></td><td>At least one of you answered “not sure”, and you’re otherwise close.</td></tr>
        <tr><td><span class="chip concern">Shared concern</span></td><td>You agree, but on the worried side.</td></tr>
      </tbody></table></div>
      <p>A topic’s agreement score is the share of its statements you agree on. 80% or more is a strength, 50 to 79% a likely strength, 30 to 49% worth discussing, and under 30% a place to start. Decision questions are compared directly: same, close (one step apart), or far apart.</p>
    </section>
    <section class="stack"><h3>What it isn’t</h3><p>Bearings hasn’t been validated as a psychological test. It doesn’t predict whether a marriage will last, and it can’t detect abuse or coercion. If something in your results worries you, a couples counselor is the right next step, and many offer a validated inventory as part of premarital counseling.</p></section>
    <section class="stack"><h3>Privacy</h3><p>Everything runs in your browser. Answers are stored on this device only. The answer code is your answers, compressed; nobody else can read it unless you send it to them. The private check is never stored.</p></section>
    <section class="stack"><h3>Credits</h3><p>All statements, decision questions and exercises were written for Bearings. The personality items are the Mini-IPIP (Donnellan, Oswald, Baird &amp; Lucas, 2006), from the public-domain International Personality Item Pool. The closeness and flexibility maps are inspired by the circumplex model of couple and family systems.</p></section>
    <div><button class="btn" data-act="go" data-to="${me() ? "home" : "home"}">Back</button></div>
  </main>`;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
const ACT = {
  go(t) { ui.screen = t.dataset.to; ui.confirmReset = false; ui.finishWarn = false; if (ui.screen === "import") ui.importMsg = null; if (ui.screen !== "results" && ui.screen !== "about" && ui.sample && !me()) { ui.sample = null; } if (ui.screen === "home" && ui.sample) ui.sample = null; render(); window.scrollTo(0, 0); },
  open(t) {
    if (t.dataset.check) {
      const p = me(); const sec = SECTION_BY_ID[t.dataset.check];
      const missing = visItems(sec, p).filter(it => isRequired(it) && p.ans[it.id] == null);
      if (missing.length && !t.dataset.ok) {
        document.querySelectorAll(".q.missing").forEach(e => e.classList.remove("missing"));
        missing.forEach(it => { const el = document.getElementById("q-" + it.id); if (el) el.classList.add("missing"); });
        const first = document.getElementById("q-" + missing[0].id);
        if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
        t.dataset.ok = "1";
        t.textContent = `Skip ${missing.length} and continue →`;
        return;
      }
    }
    ui.screen = "section"; ui.sec = t.dataset.sec; ui.flash = null; render(); window.scrollTo(0, 0);
  },
  ans(t) {
    const p = me(); const id = t.dataset.id; const v = +t.dataset.v;
    p.ans[id] = v; p.updated = Date.now(); save();
    const grp = t.closest("[data-grp]");
    grp.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t)));
    const q = t.closest(".q"); q.classList.remove("missing");
    const g = q.querySelector(".guess"); if (g) g.hidden = false;
    const secId = ITEM_BY_ID[id].sec; const pr = progress(p).per[secId];
    const bar = document.getElementById("secprog"), n = document.getElementById("secn");
    if (bar) bar.style.width = (pr.d / pr.t * 100) + "%"; if (n) n.textContent = pr.d + " / " + pr.t;
  },
  guess(t) {
    const p = me(); const id = t.dataset.id; const v = +t.dataset.v;
    if (p.gs[id] === v) { delete p.gs[id]; t.setAttribute("aria-pressed", "false"); }
    else { p.gs[id] = v; t.closest("[data-grp]").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === t))); }
    save();
  },
  finish(t) {
    const p = me(); const pr = progress(p);
    if (pr.done < pr.total && !t.dataset.force) { ui.screen = "home"; ui.finishWarn = true; render(); window.scrollTo(0, 0); return; }
    p.done = true; ui.finishWarn = false; save();
    if (data.mode === "shared") { const o = data.people[otherKey()]; ui.screen = o && o.done ? "results" : "handoff"; render(); window.scrollTo(0, 0); }
    else ACT.share();
  },
  finishCancel() { ui.finishWarn = false; render(); },
  async share() {
    ui.screen = "share"; ui.code = null; render(); window.scrollTo(0, 0);
    ui.code = await encodePerson(me()); if (ui.screen === "share") render();
  },
  copy() {
    const ta = document.getElementById("code"); const msg = document.getElementById("copied");
    const done = ok => { if (msg) msg.textContent = ok ? "Copied." : "Select the code and copy it manually."; };
    try { navigator.clipboard.writeText(ui.code).then(() => done(true), () => { ta.select(); done(false); }); } catch (e) { ta.select(); done(false); }
  },
  async import() {
    const ta = document.getElementById("importcode");
    try {
      const o = await decodePerson(ta.value);
      const p = me();
      if (o.name.toLowerCase() === p.name.toLowerCase() && o.partner.toLowerCase() === p.partner.toLowerCase()) throw new Error("That’s your own answer code. Paste the one " + p.partner + " sent you.");
      data.people[otherKey()] = o; save();
      const pr = progress(o);
      ui.flash = `Added ${o.name}’s answers (${pr.done} of ${pr.total} answered).` + (p.done ? " Your results are ready." : " Finish your own answers to unlock the results.");
      ui.screen = "home"; render(); window.scrollTo(0, 0);
    } catch (e) { ui.importMsg = { ok: false, text: e.message || "That code couldn’t be read. Check that you copied all of it." }; render(); }
  },
  handoff() { ui.screen = "handoff"; render(); window.scrollTo(0, 0); },
  switch() {
    const p = me(); const k = otherKey();
    if (!data.people[k]) data.people[k] = newPerson(p.partner, p.name, Object.assign({}, p.setup));
    data.active = k; save(); ui.screen = "home"; ui.flash = null; render(); window.scrollTo(0, 0);
  },
  tab(t) { ui.tab = t.dataset.tab; if (ui.tab !== "topics") ui.topic = null; ui.screen = "results"; render(); window.scrollTo(0, 0); },
  topic(t) { ui.tab = "topics"; ui.topic = t.dataset.topic || null; render(); window.scrollTo(0, 0); },
  star(t) { const ts = talkState(); const id = t.dataset.id; if (ts.star[id]) delete ts.star[id]; else ts.star[id] = 1; if (!ui.sample) save(); document.querySelectorAll(`[data-act="star"][data-id="${id}"]`).forEach(b => b.setAttribute("aria-pressed", String(!!ts.star[id]))); },
  done(t) { const ts = talkState(); const id = t.dataset.id; if (ts.done[id]) delete ts.done[id]; else ts.done[id] = 1; if (!ui.sample) save(); document.querySelectorAll(`[data-act="done"][data-id="${id}"]`).forEach(b => b.setAttribute("aria-pressed", String(!!ts.done[id]))); },
  talkFilter(t) { ui.talkFilter = t.dataset.f; render(); },
  sample() { ui.sample = makeSample(); ui.sampleTalk = { star: {}, done: {} }; ui.screen = "results"; ui.tab = "overview"; ui.topic = null; render(); window.scrollTo(0, 0); },
  exitSample() { ui.sample = null; ui.screen = "home"; ui.tab = "overview"; ui.topic = null; render(); window.scrollTo(0, 0); },
  edit() { ui.editing = true; render(); window.scrollTo(0, 0); },
  editCancel() { ui.editing = false; render(); },
  reset(t) {
    if (!t.dataset.force) { ui.confirmReset = true; render(); return; }
    data = blankData(); save(); try { localStorage.removeItem(STORE); } catch (e) {}
    ui.confirmReset = false; ui.screen = "home"; render(); window.scrollTo(0, 0);
  },
  resetCancel() { ui.confirmReset = false; render(); },
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "setup") return;
  e.preventDefault();
  const f = new FormData(e.target);
  const name = String(f.get("name") || "").trim(), partner = String(f.get("partner") || "").trim();
  if (!name || !partner) return;
  const setup = { stage: f.get("stage") || "engaged", cohab: f.get("cohab") || "no", kids: f.get("kids") || "none", guess: f.get("guess") !== "0" };
  const p = me();
  if (p) {
    p.name = name; p.partner = partner; p.setup = setup;
    const o = data.people[otherKey()]; if (o && data.mode === "shared") { o.setup = Object.assign({}, setup, { guess: o.setup.guess }); if (!o.imported) { o.name = partner; o.partner = name; } }
  } else {
    data.mode = f.get("mode") === "shared" ? "shared" : "own";
    data.active = "a";
    data.people.a = newPerson(name, partner, setup);
  }
  ui.editing = false; save(); render(); window.scrollTo(0, 0);
});
let openTimer = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.open) {
    const p = me(); p.open[el.dataset.open] = el.value.slice(0, 1500);
    clearTimeout(openTimer); openTimer = setTimeout(save, 400);
  }
  if (el.dataset && el.dataset.safety != null) {
    const any = Array.from(document.querySelectorAll("[data-safety]")).some(x => x.checked);
    const help = document.getElementById("safety-help"); if (help) help.hidden = !any;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.safety != null) {
    const any = Array.from(document.querySelectorAll("[data-safety]")).some(x => x.checked);
    const help = document.getElementById("safety-help"); if (help) help.hidden = !any;
  }
});

load();
render();
})();
</script>
